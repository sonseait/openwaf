[package]
name = "openwaf-acme"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Local HTTPS provider fixture only; never enable in a deployed worker.
integration-test-provider = ["openwaf-cloudflare/integration-test-provider"]

[dependencies]
openwaf-cloudflare = { path = "../cloudflare" }
anyhow.workspace = true
arc-swap.workspace = true
bytes.workspace = true
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
hickory-resolver = "0.24.4"
instant-acme = { version = "0.8.5", default-features = false, features = ["ring", "time", "x509-parser"] }
rustls-pki-types = "1"
libc = "0.2"
openwaf-tls = { path = "../tls" }
openssl.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "signal", "process"] }
zeroize.workspace = true

nix = { version = "0.30", features = ["signal", "process"] }

[dev-dependencies]
tempfile = "3"
