<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Protected application · OpenWAF</title>
<style>:root{color-scheme:light dark;--bg:#f5f7f9;--surface:#fff;--ink:#172b3a;--muted:#526878;--line:#dce5eb;--accent:#087f72}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:20px;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}main{width:min(400px,100%);padding:28px;background:var(--surface);border:1px solid var(--line);border-radius:18px}small{color:var(--accent);font-weight:700}h1{font-size:26px;line-height:1.2;margin:16px 0 12px}p{color:var(--muted)}label{display:block;font-weight:600;margin:22px 0 6px}input,button{font:inherit;width:100%;border-radius:8px;padding:12px}input{border:1px solid var(--line);background:var(--bg);color:var(--ink)}input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button{margin-top:16px;background:var(--accent);color:white;border:0;font-weight:600;cursor:pointer}footer{font-size:12px;margin-top:22px;color:var(--muted)}@media(prefers-color-scheme:dark){:root{--bg:#101a23;--surface:#15232e;--ink:#ecf3f7;--muted:#adbeca;--line:#2a3d4a;--accent:#169985}}</style></head>
<body><main><small>OpenWAF / ACCESS PROTECTION</small><h1>Protected application</h1><p role="status">{{message}}</p><form method="post" action="{{action}}"><input type="hidden" name="csrf" value="{{csrf}}"><input type="hidden" name="return_path" value="{{path}}"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128" autofocus><button type="submit">Unlock application</button></form><footer>Your access expires automatically. No username is required.</footer></main></body></html>
