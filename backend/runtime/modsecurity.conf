# Gateway owns engine mode and PL; policy defaults to DetectionOnly / PL1.
SecRuleEngine DetectionOnly
SecRequestBodyAccess On
SecRequestBodyLimit 65536
SecRequestBodyNoFilesLimit 65536
SecRequestBodyLimitAction Reject
SecResponseBodyAccess Off
SecAuditEngine Off
SecDebugLogLevel 0
SecPcreMatchLimit 10000
SecPcreMatchLimitRecursion 10000
SecTmpDir /tmp
SecRule REQUEST_HEADERS:Content-Type "@rx (?i)^application/json" "id:100001,phase:1,pass,nolog,ctl:requestBodyProcessor=JSON"
SecRule REQBODY_ERROR "!@eq 0" "id:100002,phase:2,deny,status:403,nolog"
SecRule INBOUND_DATA_ERROR "!@eq 0" "id:100003,phase:2,deny,status:403,nolog"
Include /etc/modsecurity/crs/crs-setup.conf
Include /usr/share/modsecurity-crs/rules/*.conf
