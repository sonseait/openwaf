; OpenWAF connects directly to 5432 for session advisory locks.
; Keep PGAIO's bundled pooler private; never use trust authentication here.
[databases]
* = host=/tmp port=5432

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = session
admin_users = pgbouncer,postgres
stats_users = pgbouncer,postgres
max_client_conn = 32
default_pool_size = 8
log_connections = 0
log_disconnections = 0
pidfile = /tmp/pgbouncer.pid
unix_socket_dir = /tmp
