{
  "x-openwaf-generated": "backend/runtime/vps_profiles.py; run deploy/ansible/scripts/generate-profiles.py",
  "services": {
    "gateway": {
      "cpus": 9.5,
      "mem_limit": "20480m",
      "memswap_limit": "20480m",
      "pids_limit": 512,
      "cpu_shares": 1024,
      "ulimits": {
        "nofile": {
          "soft": 8192,
          "hard": 8192
        }
      }
    },
    "postgres": {
      "cpus": 2,
      "mem_limit": "12288m",
      "memswap_limit": "12288m",
      "pids_limit": 192,
      "cpu_shares": 256,
      "ulimits": {
        "nofile": {
          "soft": 8192,
          "hard": 8192
        }
      },
      "environment": {
        "POSTGRESQL_EXTRA_FLAGS": "-c shared_buffers=1536MB -c work_mem=4MB -c maintenance_work_mem=64MB -c max_connections=40 -c max_parallel_workers=4"
      }
    },
    "clickhouse": {
