      },
      "environment": {
        "OPENWAF_VPS_PROFILE": "2c4g",
        "OPENWAF_VPS_PROFILE_SHA256": "78ececc2a79f5869242ad816ab09898fc7e77875e6b8cc7a0253ca02c657c282"
