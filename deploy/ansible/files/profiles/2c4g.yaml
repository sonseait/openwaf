{
  "x-openwaf-generated": "backend/runtime/vps_profiles.py; run deploy/ansible/scripts/generate-profiles.py",
  "services": {
    "gateway": {
      "cpus": 1,
      "mem_limit": "1280m",
      "memswap_limit": "1280m",
      "pids_limit": 192,
      "cpu_shares": 1024,
      "ulimits": {
        "nofile": {
          "soft": 8192,
          "hard": 8192
        }
      }
    },
    "postgres": {
      "cpus": 0.4,
      "mem_limit": "512m",
      "memswap_limit": "512m",
      "pids_limit": 192,
      "cpu_shares": 256,
      "ulimits": {
        "nofile": {
          "soft": 8192,
          "hard": 8192
        }
      },
      "environment": {
        "POSTGRESQL_EXTRA_FLAGS": "-c shared_buffers=64MB -c work_mem=2MB -c maintenance_work_mem=32MB -c max_connections=40 -c max_parallel_workers=1"
      }
    },
    "clickhouse": {
      "cpus": 0.3,
      "mem_limit": "768m",
      "memswap_limit": "768m",
      "pids_limit": 256,
      "cpu_shares": 256,
