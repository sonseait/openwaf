{
  "x-openwaf-generated": "backend/runtime/vps_profiles.py; run deploy/ansible/scripts/generate-profiles.py",
  "services": {
    "gateway": {
      "cpus": 2,
      "mem_limit": "2560m",
      "memswap_limit": "2560m",
      "pids_limit": 256,
      "cpu_shares": 1024,
      "ulimits": {
        "nofile": {
          "soft": 8192,
          "hard": 8192
        }
      }
    },
    "postgres": {
      "cpus": 0.8,
      "mem_limit": "1024m",
      "memswap_limit": "1024m",
      "pids_limit": 192,
      "cpu_shares": 256,
      "ulimits": {
        "nofile": {
          "soft": 8192,
          "hard": 8192
        }
      },
      "environment": {
        "POSTGRESQL_EXTRA_FLAGS": "-c shared_buffers=128MB -c work_mem=4MB -c maintenance_work_mem=32MB -c max_connections=40 -c max_parallel_workers=2"
      }
    },
    "clickhouse": {
      "cpus": 0.65,
      "mem_limit": "1536m",
      "memswap_limit": "1536m",
