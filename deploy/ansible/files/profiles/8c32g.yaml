{
  "x-openwaf-generated": "backend/runtime/vps_profiles.py; run deploy/ansible/scripts/generate-profiles.py",
  "services": {
    "gateway": {
      "cpus": 4.5,
      "mem_limit": "10240m",
      "memswap_limit": "10240m",
      "pids_limit": 384,
      "cpu_shares": 1024,
      "ulimits": {
        "nofile": {
          "soft": 8192,
          "hard": 8192
        }
      }
    },
    "postgres": {
      "cpus": 1.25,
      "mem_limit": "6144m",
      "memswap_limit": "6144m",
      "pids_limit": 192,
      "cpu_shares": 256,
      "ulimits": {
        "nofile": {
          "soft": 8192,
          "hard": 8192
        }
      },
      "environment": {
        "POSTGRESQL_EXTRA_FLAGS": "-c shared_buffers=768MB -c work_mem=4MB -c maintenance_work_mem=64MB -c max_connections=40 -c max_parallel_workers=4"
      }
    },
    "clickhouse": {
      "cpus": 1.25,
      "mem_limit": "8192m",
      "memswap_limit": "8192m",
